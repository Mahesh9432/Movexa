services:
  db:
    image: postgres:16
    container_name: movexa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: movexa
    ports:
      - "5432:5432"
    volumes:
      - movexa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d movexa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  movexa_pgdata:
